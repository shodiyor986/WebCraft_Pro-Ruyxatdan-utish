<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebCraft Pro – Registration & Dashboard</title>
  <link rel="stylesheet" href="reg.css" />
</head>
<body>
  <section id="auth-section">
    <h1>WebCraft Pro</h1>
    <div class="tabs">
      <button class="tab-btn" data-target="register_form">Register</button>
      <button class="tab-btn" data-target="login_form">Login</button>
    </div>

    <form id="register_form" class="auth-form glass" style="display:none;">
      <h2>Register</h2>
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn gradient-btn">Sign Up</button>
    </form>

    <form id="login_form" class="auth-form glass" style="display:none;">
      <h2>Login</h2>
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn gradient-btn">Log In</button>
    </form>
  </section>

  <section id="dashboard" class="glass" style="display:none;">
    <h2 id="welcome">Welcome</h2>
    <button id="logout_btn" class="btn gradient-btn">Logout</button>
    <hr />
    <h3>Choose a Plan</h3>
    <form id="plan_form" class="glass">
      <select name="plan" required>
        <option value="free">Free</option>
        <option value="pro">Pro</option>
        <option value="enterprise">Enterprise</option>
      </select>
      <button type="submit" class="btn gradient-btn">Select Plan</button>
    </form>
    <hr />
    <h3>Project Management</h3>
    <form id="save_project_form" class="glass">
      <input type="text" name="project_name" placeholder="Project Name" required />
      <textarea name="project_data" id="project_data" rows="4" placeholder="Project data (JSON, code, etc.)"></textarea>
      <button type="submit" class="btn gradient-btn">Save Project</button>
    </form>
    <form id="load_project_form" class="glass" style="margin-top:1rem;">
      <input type="text" name="project_name" placeholder="Project Name" required />
      <button type="submit" class="btn gradient-btn">Load Project</button>
    </form>
  </section>

  <script src="reg.js"></script>
  <script>
    // Simple tab navigation
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-target');
        document.querySelectorAll('.auth-form').forEach(f => f.style.display = 'none');
        const form = document.getElementById(target);
        if (form) form.style.display = 'block';
      });
    });
    // Show register form by default
    document.querySelector('.tab-btn[data-target="register_form"]').click();
  </script>
</body>
</html>
