<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebCraft Pro – Registration & Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="reg.css">
</head>
<body class="dark">

  <nav class="navigation">
    <ul>
      <li class="nav-item"><a href="#register">Register</a></li>
      <li class="nav-item"><a href="#login">Login</a></li>
      <li class="nav-item"><a href="#plans">Plans</a></li>
      <li class="nav-item"><a href="#dashboard">Dashboard</a></li>
    </ul>
  </nav>

  <main id="content">

    <section id="register" class="section">
      <h2>Register</h2>
      <form id="register_form" class="form card">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">Register</button>
      </form>
      <div id="regResult" class="result"></div>
    </section>

    <section id="login" class="section">
      <h2>Login</h2>
      <form id="login_form" class="form card">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
      </form>
      <div id="loginResult" class="result"></div>
    </section>

    <section id="plans" class="section">
      <h2>Plans</h2>
      <div class="plan-grid">
        <div class="plan-cell card" data-plan="free">Free</div>
        <div class="plan-cell card" data-plan="pro">Pro</div>
        <div class="plan-cell card" data-plan="enterprise">Enterprise</div>
      </div>
      <div id="planResult" class="result"></div>
    </section>

    <section id="dashboard" class="section">
      <h2>Dashboard</h2>
      <div id="dashboardContent" class="card" contenteditable="true">
        <p>Start building your project here...</p>
      </div>
      <div class="dashboard-controls">
        <button id="saveProjectBtn" class="btn">Save Project</button>
        <button id="loadProjectBtn" class="btn">Load Project</button>
      </div>
      <div id="dashboardResult" class="result"></div>
    </section>

  </main>

  <script src="reg.js"></script>
</body>
</html>
