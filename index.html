<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#79b9e8">
  <title>OPEN WORLD — Voxel Cosmos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="world">
  <div id="loading"><div class="spinner"></div><b>OPEN WORLD</b><span>Blokli dunyo yuklanmoqda...</span></div>
  <main id="game"></main>
  <section id="hud">
    <header><b>OPEN <em>WORLD</em></b><span id="coords">X: 0 · Y: 0 · Z: 0</span></header>
    <div class="crosshair">+</div>
    <div id="help">WASD — yurish · Space — sakrash · Sichqoncha — qarash · Chap tugma — qazish · O‘ng tugma — blok qo‘yish</div>
    <nav id="hotbar">
      <button class="slot active" data-block="grass">1<br>🌿</button>
      <button class="slot" data-block="dirt">2<br>🟫</button>
      <button class="slot" data-block="stone">3<br>🪨</button>
      <button class="slot" data-block="wood">4<br>🪵</button>
      <button class="slot" data-block="sand">5<br>🟨</button>
    </nav>
    <button id="space-btn">🚀 Kosmos</button>
    <div id="mobile-controls">
      <div class="dpad">
        <button data-move="forward">▲</button>
        <div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div>
      </div>
      <div class="actions"><button id="jump">SAKRASH</button><button id="mine">QAZISH</button><button id="place">QO‘YISH</button></div>
    </div>
    <div id="space-menu" class="hidden">
      <div class="dialog">
        <button id="close-space" class="close">✕</button>
        <h2>Kosmosga sayohat</h2><p>Sayyorani tanlang:</p>
        <div class="planet-links">
          <a href="earth.html">🌍 Yer</a><a href="moon.html">🌙 Oy</a><a href="sun.html">☀️ Quyosh</a>
        </div>
        <small>Quyoshga yaqinlashish va uning ustiga qo‘nish o‘chirilgan.</small>
      </div>
    </div>
  </section>
  <script type="module" src="game.js"></script>
</body>
</html>
