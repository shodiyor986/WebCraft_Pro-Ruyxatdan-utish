<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCraft Pro – Registration</title>
<link rel="stylesheet" href="reg.css">
</head>
<body>
<main class="container">
  <section id="registration-section">
    <h1>Registration</h1>
    <form id="registrationForm">
      <label>Username</label><br>
      <input type="text" name="username" placeholder="Username" required><br>
      <label>Password</label><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Register</button>
    </form>
    <pre id="regResult"></pre>
  </section>

  <section id="login-section">
    <h1>Login</h1>
    <form id="loginForm">
      <label>Username</label><br>
      <input type="text" name="username" placeholder="Username" required><br>
      <label>Password</label><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <pre id="loginResult"></pre>
  </section>

  <section id="plan-section">
    <h1>Plan Packages</h1>
    <div id="planContainer" class="plan-gradient">
      <div class="plan-card" data-plan="free">Free</div>
      <div class="plan-card" data-plan="pro">Pro</div>
      <div class="plan-card" data-plan="enterprise">Enterprise</div>
    </div>
    <pre id="planResult"></pre>
  </section>

  <section id="dashboard-section">
    <h1>Dashboard</h1>
    <div id="dashboard" class="dashboard"></div>
    <button id="saveProjectBtn" class="glow-button">Save Project</button>
    <button id="loadProjectBtn" class="glow-button">Load Project</button>
    <pre id="projectResult"></pre>
  </section>
</main>
<script src="reg.js"></script>
</body>
</html>
