<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>WebCraft Pro – Ro‘yxatdan o‘tish & Dashboard</title>
<link rel="stylesheet" href="reg.css">
</head>
<body>
<div class="grid-bg"></div>
<div class="orb" style="width:200px;height:200px;top:10%;left:15%;"></div>
<div class="orb" style="width:150px;height:150px;bottom:20%;right:10%;"></div>

<header class="header">
<h1>WebCraft Pro</h1>
<nav class="nav">
<ul>
<li><a href="#register">Ro‘yxatdan o‘tish</a></li>
<li><a href="#login">Kirish</a></li>
<li><a href="#plans">Tarif rejalari</a></li>
<li><a href="#dashboard">Dashboard</a></li>
</ul>
</nav>
</header>

<main class="container">
<section id="register" class="card">
<h2>Ro‘yxatdan o‘tish</h2>
<form id="registerForm">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Parol" required>
<button type="submit" class="btn">Ro‘yxatdan o‘tish</button>
</form>
<div id="registerResponse" class="response"></div>
</section>

<section id="login" class="card">
<h2>Kirish</h2>
<form id="loginForm">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Parol" required>
<button type="submit" class="btn">Kirish</button>
</form>
<div id="loginResponse" class="response"></div>
</section>

<section id="plans" class="card">
<h2>Tarif rejalari</h2>
<div class="plan-grid">
<div class="plan card">
<h3>Free</h3>
<p>Basic features</p>
<button class="btn select-plan" data-plan="free">Tanlash</button>
</div>
<div class="plan card">
<h3>Pro</h3>
<p>All premium features</p>
<button class="btn select-plan" data-plan="pro">Tanlash</button>
</div>
<div class="plan card">
<h3>Enterprise</h3>
<p>Custom solutions</p>
<button class="btn select-plan" data-plan="enterprise">Tanlash</button>
</div>
</div>
<div id="planResponse" class="response"></div>
</section>

<section id="dashboard" class="card hidden">
<h2>Dashboard</h2>
<p>Salom, <span id="userEmail"></span>!</p>
<button id="logoutBtn" class="btn">Chiqish</button>

<h3>Loyihalar</h3>
<div id="projectList" class="project-list"></div>

<h3>Yangi loyiha</h3>
<form id="projectForm">
<input type="text" name="title" placeholder="Loyiha sarlavhasi" required>
<textarea name="content" placeholder="Loyiha tavsifi" required></textarea>
<button type="submit" class="btn">Saqlash</button>
</form>
<div id="projectResponse" class="response"></div>
</section>
</main>

<script src="reg.js"></script>
</body>
</html>
