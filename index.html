<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebCraft Pro – Ro‘yxatdan o‘tish & Dashboard</title>
  <link rel="stylesheet" href="reg.css">
</head>
<body>
  <main id="app">
    <section id="auth-section" class="glass">
      <h1>WebCraft Pro</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-target="register-form">Ro‘yxatdan o‘tish</button>
        <button class="tab-btn" data-target="login-form">Kirish</button>
      </nav>

      <form id="register-form" class="auth-form">
        <h2>Ro‘yxatdan o‘tish</h2>
        <input type="text" name="username" placeholder="Foydalanuvchi" required>
        <input type="password" name="password" placeholder="Parol" required>
        <button type="submit" class="btn gradient-btn">Ro‘yxatdan o‘tish</button>
      </form>

      <form id="login-form" class="auth-form" hidden>
        <h2>Kirish</h2>
        <input type="text" name="username" placeholder="Foydalanuvchi" required>
        <input type="password" name="password" placeholder="Parol" required>
        <button type="submit" class="btn gradient-btn">Kirish</button>
      </form>
    </section>

    <section id="dashboard" class="glass" hidden>
      <header class="dash-header">
        <h2 id="welcome">Xush kelibsiz</h2>
        <button id="logout-btn" class="btn gradient-btn">Chiqish</button>
      </header>

      <article class="plan-section">
        <h3>Tarif rejalari</h3>
        <form id="plan-form" class="plain-form">
          <select name="plan" required>
            <option value="" disabled selected>Reja tanlang</option>
            <option value="free">Free</option>
            <option value="pro">Pro</option>
            <option value="enterprise">Enterprise</option>
          </select>
          <button type="submit" class="btn gradient-btn">Tanlash</button>
        </form>
      </article>

      <article class="project-section">
        <h3>Loyihalar</h3>
        <form id="save-project-form" class="plain-form">
          <input type="text" name="project_name" placeholder="Loyiha nomi" required>
          <textarea name="project_data" id="project_data" rows="6" placeholder="Loyiha ma'lumotlari (JSON, kod va hokazo)"></textarea>
          <button type="submit" class="btn gradient-btn">Saqlash</button>
        </form>

        <form id="load-project-form" class="plain-form" style="margin-top:1rem;">
          <input type="text" name="project_name" placeholder="Loyiha nomi" required>
          <button type="submit" class="btn gradient-btn">Yuklash</button>
        </form>
      </article>
    </section>
  </main>

  <!-- Orbs for visual effect -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <script src="reg.js"></script>
</body>
</html>
