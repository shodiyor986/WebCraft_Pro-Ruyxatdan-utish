<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCraft Pro - Ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="reg.css" />
</head>
<body>
    <!-- Neon Grid Background -->
    <div class="grid-bg"></div>
    <main class="container">
        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab active" data-target="register">Ro'yxatdan o'tish</button>
            <button class="tab" data-target="login">Kirish</button>
            <button class="tab" data-target="plans">Tarif Rejalari</button>
            <button class="tab" data-target="dashboard">Dashboard</button>
        </nav>

        <!-- Register Form -->
        <section class="panel" id="register">
            <h2>Ro'yxatdan o'tish</h2>
            <form id="registerForm" class="glass">
                <input type="text" name="username" placeholder="Foydalanuvchi nomi" required />
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Parol" required />
                <button type="submit" class="gradient-btn">Ro'yxatdan o'tish</button>
            </form>
        </section>

        <!-- Login Form -->
        <section class="panel hidden" id="login">
            <h2>Kirish</h2>
            <form id="loginForm" class="glass">
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Parol" required />
                <button type="submit" class="gradient-btn">Kirish</button>
            </form>
        </section>

        <!-- Plans -->
        <section class="panel hidden" id="plans">
            <h2>Tarif Rejalari</h2>
            <div class="plans-grid">
                <div class="plan-card glass">
                    <h3>Free</h3>
                    <p>Cheklangan funksiyalar</p>
                    <button class="choose-plan gradient-btn" data-plan="free">Tanlash</button>
                </div>
                <div class="plan-card glass">
                    <h3>Pro</h3>
                    <p>To'liq funksiyalar</p>
                    <button class="choose-plan gradient-btn" data-plan="pro">Tanlash</button>
                </div>
                <div class="plan-card glass">
                    <h3>Enterprise</h3>
                    <p>Korporativ paket</p>
                    <button class="choose-plan gradient-btn" data-plan="enterprise">Tanlash</button>
                </div>
            </div>
        </section>

        <!-- Dashboard -->
        <section class="panel hidden" id="dashboard">
            <h2>Dashboard</h2>
            <div class="dashboard-content glass">
                <p>Bu yerda foydalanuvchi loyihalari, statistikalar va sozlamalar ko'rsatiladi.</p>
                <!-- Example Project List -->
                <ul id="projectList"></ul>
                <button id="saveProject" class="gradient-btn">Loyihani saqlash</button>
                <button id="loadProject" class="gradient-btn">Loyihani yuklash</button>
            </div>
        </section>

        <!-- Response Area -->
        <section id="responseArea" class="response hidden"></section>
    </main>

    <script src="reg.js"></script>
</body>
</html>
