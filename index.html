<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft Pro – Ro‘yxatdan o‘tish, Kirish, Tarif, Dashboard</title>
  <link rel="stylesheet" href="reg.css">
  <script defer src="reg.js"></script>
</head>
<body>
  <header class="header">
    <h1>WebCraft Pro</h1>
    <nav>
      <ul class="nav-list">
        <li><a href="#register">Ro‘yxatdan o‘tish</a></li>
        <li><a href="#login">Kirish</a></li>
        <li><a href="#plans">Tarif rejalari</a></li>
        <li><a href="#dashboard">Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <!-- Registration Section -->
    <section id="register" class="auth-section">
      <h2>Ro‘yxatdan o‘tish</h2>
      <form id="registerForm" class="auth-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Parol" required>
        <button type="submit" class="btn">Ro‘yxatdan o‘tish</button>
        <div id="registerResponse" class="response"></div>
      </form>
    </section>

    <!-- Login Section -->
    <section id="login" class="auth-section hidden">
      <h2>Kirish</h2>
      <form id="loginForm" class="auth-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Parol" required>
        <button type="submit" class="btn">Kirish</button>
        <div id="loginResponse" class="response"></div>
      </form>
    </section>

    <!-- Plans Section -->
    <section id="plans" class="dashboard-section hidden">
      <h2>Tarif rejalari</h2>
      <div class="plan-grid">
        <div class="plan-card" data-plan="free">
          <h3>Free</h3>
          <p>Cheklangan funksiyalar</p>
          <button class="btn select-plan" data-plan="free">Tanlash</button>
        </div>
        <div class="plan-card" data-plan="pro">
          <h3>Pro</h3>
          <p>To‘liq funksiyalar</p>
          <button class="btn select-plan" data-plan="pro">Tanlash</button>
        </div>
        <div class="plan-card" data-plan="enterprise">
          <h3>Enterprise</h3>
          <p>Maxsus yechimlar</p>
          <button class="btn select-plan" data-plan="enterprise">Tanlash</button>
        </div>
      </div>
      <div id="planResponse" class="response"></div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboard" class="dashboard-section hidden">
      <h2>Dashboard</h2>
      <div class="project-panel">
        <input type="text" id="projectName" placeholder="Loyiha nomi">
        <textarea id="projectEditor" placeholder="Loyiha kodini kiriting..."></textarea>
        <button id="saveProjectBtn" class="btn">Saqlash</button>
        <div id="projectResponse" class="response"></div>
      </div>
      <ul id="projectList" class="project-list"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2024 WebCraft Pro. Barcha huquqlar himoyalangan.</p>
  </footer>
</body>
</html>
