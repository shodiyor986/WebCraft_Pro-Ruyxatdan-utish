<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft Pro</title>
  <link rel="stylesheet" href="reg.css">
</head>
<body>
  <header>
    <nav class="nav">
      <ul>
        <li><a href="#register">Register</a></li>
        <li><a href="#login">Login</a></li>
        <li><a href="#plans">Plans</a></li>
        <li><a href="#dashboard">Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    <!-- Register Section -->
    <section id="register" class="card">
      <h2>Register</h2>
      <form id="register_form">
        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" class="btn">Register</button>
      </form>
      <p id="registerResult"></p>
    </section>

    <!-- Login Section -->
    <section id="login" class="card">
      <h2>Login</h2>
      <form id="login_form">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" class="btn">Login</button>
      </form>
      <p id="loginResult"></p>
    </section>

    <!-- Plans Section -->
    <section id="plans" class="card">
      <h2>Plans</h2>
      <div class="plan_grid">
        <div class="plan_card" data-plan="free">
          <h3>Free</h3>
          <button class="btn select_plan">Select</button>
        </div>
        <div class="plan_card" data-plan="pro">
          <h3>Pro</h3>
          <button class="btn select_plan">Select</button>
        </div>
        <div class="plan_card" data-plan="enterprise">
          <h3>Enterprise</h3>
          <button class="btn select_plan">Select</button>
        </div>
      </div>
      <p id="planResult"></p>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboard" class="card">
      <h2>Dashboard</h2>
      <button id="saveProjectBtn" class="btn">Save Project</button>
      <button id="loadProjectBtn" class="btn">Load Project</button>
      <pre id="dashboardResult"></pre>
    </section>
  </main>

  <script src="reg.js"></script>
</body>
</html>
