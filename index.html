<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCraft Pro – Ro‘yxatdan o‘tish & Dashboard</title>
    <link rel="stylesheet" href="reg.css" />
</head>
<body>
    <header class="header">
        <h1>WebCraft Pro</h1>
        <nav class="nav">
            <ul>
                <li><a href="#register">Ro‘yxatdan o‘tish</a></li>
                <li><a href="#login">Kirish</a></li>
                <li><a href="#plans">Tarif rejalari</a></li>
                <li><a href="#dashboard">Dashboard</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <!-- Register Section -->
        <section id="register" class="card">
            <h2>Ro‘yxatdan o‘tish</h2>
            <form id="registerForm">
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Parol" required />
                <button type="submit" class="btn">Ro‘yxatdan o‘tish</button>
            </form>
            <div id="registerResponse" class="response"></div>
        </section>
        <!-- Login Section -->
        <section id="login" class="card">
            <h2>Kirish</h2>
            <form id="loginForm">
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Parol" required />
                <button type="submit" class="btn">Kirish</button>
            </form>
            <div id="loginResponse" class="response"></div>
        </section>
        <!-- Plans Section -->
        <section id="plans" class="card">
            <h2>Tarif rejalari</h2>
            <div class="plan-grid">
                <div class="plan-card" data-plan="free">
                    <h3>Free</h3>
                    <p>Bazaviy funksiyalar</p>
                    <button class="btn select-plan" data-plan="free">Tanlash</button>
                </div>
                <div class="plan-card" data-plan="pro">
                    <h3>Pro</h3>
                    <p>Qo‘shimcha imkoniyatlar</p>
                    <button class="btn select-plan" data-plan="pro">Tanlash</button>
                </div>
                <div class="plan-card" data-plan="enterprise">
                    <h3>Enterprise</h3>
                    <p>To‘liq qo‘llab-quvvatlash</p>
                    <button class="btn select-plan" data-plan="enterprise">Tanlash</button>
                </div>
            </div>
            <div id="planResponse" class="response"></div>
        </section>
        <!-- Dashboard Section -->
        <section id="dashboard" class="card hidden">
            <h2>Dashboard</h2>
            <p>Bu yerda foydalanuvchi loyihalarini boshqarish mumkin.</p>
            <div id="projectList" class="project-list"></div>
            <button id="logoutBtn" class="btn">Chiqish</button>
        </section>
    </main>
    <script src="reg.js"></script>
</body>
</html>
