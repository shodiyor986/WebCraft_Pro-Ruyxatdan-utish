<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#172638">
  <title>OPEN WORLD — Voxel Cosmos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="world">
  <main id="game"></main>
  <section id="hud">
    <header class="topbar">
      <div class="logo">OPEN<span>WORLD</span></div>
      <div class="status"><span class="sun-icon">☀</span><span id="clock">08:00</span><span id="coords">X: 0 · Z: 0</span></div>
    </header>
    <div class="crosshair"><i></i></div>
    <div id="toast" class="toast">WASD — yurish · E — raketaga chiqish</div>
    <div class="bottom-ui">
      <nav id="hotbar" aria-label="Blok tanlash">
        <button class="slot active" data-block="grass"><small>1</small><span>▦</span><b>O‘t</b></button>
        <button class="slot" data-block="dirt"><small>2</small><span>▦</span><b>Tuproq</b></button>
        <button class="slot" data-block="stone"><small>3</small><span>▦</span><b>Tosh</b></button>
        <button class="slot" data-block="wood"><small>4</small><span>▦</span><b>Yog‘och</b></button>
        <button class="slot" data-block="sand"><small>5</small><span>▦</span><b>Qum</b></button>
      </nav>
    </div>
    <button id="rocket-btn" class="rocket-btn"><span>🚀</span><b>RAKETAGA CHIQISH</b><small>E</small></button>
    <div id="mobile-controls">
      <div class="move-pad">
        <button data-move="forward" aria-label="Oldinga">▲</button>
        <div><button data-move="left" aria-label="Chapga">◀</button><button data-move="back" aria-label="Orqaga">▼</button><button data-move="right" aria-label="O‘ngga">▶</button></div>
      </div>
      <div class="action-pad">
        <button id="jump" title="Sakrash">↥<small>Sakrash</small></button>
        <button id="mine" title="Qazish">⛏<small>Qazish</small></button>
        <button id="place" title="Blok qo‘yish">▣<small>Qo‘yish</small></button>
      </div>
    </div>
    <div id="space-menu" class="hidden">
      <div class="dialog">
        <button id="close-space" class="close" aria-label="Yopish">×</button>
        <div class="dialog-icon">🚀</div><h2>Kosmos sayohati</h2>
        <p>Raketa orqali orbitaga chiqding. Sayyorani tanla:</p>
        <div class="planet-links">
          <a href="earth.html">🌍 <span>Yer</span></a>
          <a href="moon.html">🌙 <span>Oy</span></a>
          <a href="sun.html">☀️ <span>Quyosh</span></a>
        </div>
        <small>Quyosh faqat uzoqdan kuzatiladi. Unga qo‘nish mumkin emas.</small>
      </div>
    </div>
    <div id="launch-overlay" class="hidden"><div class="launch-message">🚀 <b>UCHISH!</b><span>Atmosferadan chiqilmoqda...</span></div></div>
  </section>
  <script type="module" src="game.js"></script>
</body>
</html>
