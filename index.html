<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebCraft Pro – Registration, Login, Plans & Dashboard</title>
  <link rel="stylesheet" href="reg.css" />
</head>
<body>
  <div class="container">
    <nav class="tabs">
      <a href="#register-section" class="active" data-target="register">Register</a>
      <a href="#login-section" data-target="login">Login</a>
      <a href="#plans-section" data-target="plan">Plans</a>
      <a href="#dashboard-section" data-target="dashboard">Dashboard</a>
    </nav>

    <!-- Registration Section -->
    <section id="register-section" class="section">
      <h2>Register</h2>
      <form id="register-form" class="register-form">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required />
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required />
        <button type="submit" class="btn">Register</button>
      </form>
    </section>

    <!-- Login Section -->
    <section id="login-section" class="section" style="display:none;">
      <h2>Login</h2>
      <form id="login-form" class="login-form">
        <label for="login-username">Username</label>
        <input type="text" name="username" id="login-username" required />
        <label for="login-password">Password</label>
        <input type="password" name="password" id="login-password" required />
        <button type="submit" class="btn">Login</button>
      </form>
    </section>

    <!-- Plans Section -->
    <section id="plans-section" class="section" style="display:none;">
      <h2>Choose a Plan</h2>
      <div class="plan-container">
        <table class="plan-table">
          <tr><th>Plan</th><th>Price</th></tr>
          <tr><td><a href="#" data-target="plan" data-plan="basic">Basic</a></td><td>$9.99</td></tr>
          <tr><td><a href="#" data-target="plan" data-plan="pro">Pro</a></td><td>$19.99</td></tr>
          <tr><td><a href="#" data-target="plan" data-plan="enterprise">Enterprise</a></td><td>$49.99</td></tr>
        </table>
      </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboard-section" class="section" style="display:none;">
      <h2>Dashboard</h2>
      <div class="glass">
        <input type="text" id="project-title" placeholder="Project Title" />
        <textarea id="code-editor" rows="10" placeholder="Write your code here..."></textarea>
        <div class="dashboard-controls">
          <button id="save-project-btn" class="btn">Save Project</button>
          <input type="text" id="project-id" placeholder="Project ID" />
          <button id="load-project-btn" class="btn">Load Project</button>
        </div>
      </div>
    </section>
  </div>
  <script src="reg.js"></script>
</body>
</html>
