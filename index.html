<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft Pro – Registration, Login, Plans & Dashboard</title>
  <link rel="stylesheet" href="reg.css">
</head>
<body>
  <nav class="tabs">
    <a href="#" data-target="register" class="active">Register</a>
    <a href="#" data-target="login">Login</a>
    <a href="#" data-target="plans">Plans</a>
    <a href="#" data-target="dashboard">Dashboard</a>
  </nav>

  <section id="register-section" class="section">
    <h2>Register</h2>
    <form id="register-form" class="form">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" name="username" required>
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" name="password" required>
      <button type="submit" class="btn">Register</button>
    </form>
  </section>

  <section id="login-section" class="section hidden">
    <h2>Login</h2>
    <form id="login-form" class="form">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" name="username" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" required>
      <button type="submit" class="btn">Login</button>
    </form>
  </section>

  <section id="plans-section" class="section hidden">
    <h2>Choose a Plan</h2>
    <div class="plan-grid">
      <button class="plan-btn" data-plan="basic">Basic – $9.99</button>
      <button class="plan-btn" data-plan="pro">Pro – $19.99</button>
      <button class="plan-btn" data-plan="enterprise">Enterprise – $49.99</button>
    </div>
  </section>

  <section id="dashboard-section" class="section hidden">
    <h2>Dashboard</h2>
    <div class="glass">
      <input type="text" id="project-title" placeholder="Project Title">
      <textarea id="code-editor" rows="10" placeholder="Write your code here..."></textarea>
      <div class="dashboard-controls">
        <button id="save-project-btn" class="btn">Save Project</button>
        <input type="text" id="project-id" placeholder="Project ID">
        <button id="load-project-btn" class="btn">Load Project</button>
      </div>
    </div>
  </section>

  <script src="reg.js"></script>
</body>
</html>
